<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>勤怠トラッカー</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <div id="titleRow">
      <h1>勤怠トラッカー</h1>
      <button id="openTabBtn" type="button" title="別タブで開く">タブで開く</button>
    </div>

    <div id="userIdSection">
      <label for="userIdInput">ChatworkユーザーID</label>
      <div id="userIdRow">
        <input type="text" id="userIdInput" placeholder="例: 10808330" />
        <button id="saveUserIdBtn">保存</button>
      </div>
      <p id="userIdHint" class="hint">Chatworkのタブのコンソールで <code>window.MYID</code> を実行して確認できます</p>
    </div>

    <div id="controls">
      <select id="yearSelect"></select>
      <span>年</span>
      <select id="monthSelect"></select>
      <span>月</span>
      <button id="fetchBtn">取得</button>
      <button id="forceFetchBtn">強制取得</button>
    </div>

    <div id="status" class="hidden"></div>

    <div id="summaryCard" class="summary-card hidden">
      <div class="summary-item">
        <span class="summary-label">営業日数</span>
        <span class="summary-value" id="summaryWorkDays">-</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">残業時間合計</span>
        <span class="summary-value" id="summaryTotalOt">-</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">1日平均残業</span>
        <span class="summary-value" id="summaryAvgOt">-</span>
      </div>
    </div>

    <div id="tableWrapper" class="hidden">
      <table id="attendanceTable">
        <thead>
          <tr>
            <th>日付</th>
            <th>出勤</th>
            <th>退勤</th>
            <th>勤務時間</th>
            <th>残業時間</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <p class="hint">シングルクリック: コピー / <b>ダブルクリック: 時間編集</b></p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
