<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 14px;
      color: #333;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 15px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }
    label:first-of-type {
      margin-top: 0;
    }
    select {
      width: 100%;
      padding: 4px 6px;
      font-size: 14px;
    }
    input[type="number"] {
      width: 64px;
      padding: 4px 6px;
      font-size: 14px;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      background-color: #c0392b;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #a93226;
    }
    #status {
      margin-top: 8px;
      min-height: 1.4em;
      font-size: 12px;
    }
    #status.error {
      color: #c0392b;
    }
    #status.success {
      color: #27ae60;
    }
  </style>
</head>
<body>
  <h1>⚡ 一発入力の設定</h1>
  <label for="due-date-offset">期日</label>
  <div class="row">
    <span>今日から</span>
    <input type="number" id="due-date-offset" min="0" max="365" step="1">
    <span>日後</span>
  </div>
  <label for="affiliation">所属(旧トラッカー)</label>
  <!-- Redmineの「所属(旧トラッカー)」の選択肢。valueはRedmine側の選択肢value -->
  <select id="affiliation">
    <option value="2">ディレクター</option>
    <option value="3">デザイナー</option>
    <option value="4">システム</option>
    <option value="5">コンテンツ</option>
    <option value="6">動画制作</option>
    <option value="7">日報</option>
    <option value="9">過去分</option>
    <option value="10">MTG</option>
    <option value="11">新規プロジェクト登録</option>
    <option value="12">マーケ</option>
    <option value="16">制作進行管理</option>
    <option value="17">外部依頼管理</option>
    <option value="18">印刷物制作</option>
    <option value="20">障害対応</option>
    <option value="52">PR</option>
  </select>
  <button type="button" id="save">保存</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
