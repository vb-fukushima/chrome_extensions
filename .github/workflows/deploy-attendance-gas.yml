name: Deploy attendance-tracker GAS

on:
  push:
    branches: [main]
    paths:
      - 'chatwork-attendance-tracker/gas/**'
      - '.github/workflows/deploy-attendance-gas.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatwork-attendance-tracker/gas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$GAS_SCRIPT_ID" > .clasp.json

      - name: Push code
        run: clasp push --force

      # 既存のデプロイを更新するのでウェブアプリのURLは変わらない
      - name: Update web app deployment
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$GAS_DEPLOYMENT_ID" --description "$GITHUB_SHA"
